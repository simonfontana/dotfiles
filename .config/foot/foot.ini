# Only what differs from foot's defaults; see /etc/xdg/foot/foot.ini

include=/usr/share/foot/themes/onedark
font=monospace:size=9.5

[scrollback]
lines=100000
multiplier=6

[colors-dark]
# onedark's bright black is barely visible on its background; use One
# Dark's comment grey, for autosuggestions and other dimmed text
bright0=5c6370
